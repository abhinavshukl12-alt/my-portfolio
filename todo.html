<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Daily Goal Tracker</title>

<style>

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
    radial-gradient(circle at top,
    #0f172a,
    #020617);

    color: white;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    min-height: 100vh;

    padding-top: 40px;
}

.container {

    width: 420px;

    background:
    rgba(255,255,255,0.05);

    border-radius: 20px;

    padding: 25px;

    backdrop-filter: blur(12px);

    box-shadow:
    0 0 25px #38bdf8;
}

h1 {

    text-align: center;

    text-shadow:
    0 0 15px #38bdf8;

    margin-bottom: 20px;
}

.stats {

    text-align: center;

    margin-bottom: 20px;

    color: #38bdf8;
}

input[type="date"],
input[type="text"] {

    width: 100%;

    padding: 12px;

    margin-top: 10px;

    border: none;

    border-radius: 12px;

    background:
    rgba(255,255,255,0.1);

    color: white;

    font-size: 16px;

    box-sizing: border-box;
}

input::placeholder {

    color: #cbd5e1;
}

.add-btn {

    width: 100%;

    margin-top: 15px;

    padding: 12px;

    border: none;

    border-radius: 12px;

    background: #38bdf8;

    color: black;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;
}

.add-btn:hover {

    transform: scale(1.03);

    box-shadow:
    0 0 15px #38bdf8;
}

ul {

    list-style: none;

    padding: 0;

    margin-top: 25px;
}

li {

    background:
    rgba(255,255,255,0.08);

    margin-bottom: 12px;

    padding: 12px;

    border-radius: 14px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    transition: 0.3s;
}

li:hover {

    transform: scale(1.02);

    box-shadow:
    0 0 12px rgba(56,189,248,0.5);
}

.task-left {

    display: flex;

    align-items: center;

    gap: 10px;
}

.task-info {

    display: flex;

    flex-direction: column;
}

.date {

    font-size: 13px;

    color: #38bdf8;

    margin-top: 3px;
}

.completed {

    text-decoration: line-through;

    opacity: 0.7;

    color: #22c55e;

    text-shadow:
    0 0 10px #22c55e;
}

input[type="checkbox"] {

    width: 22px;

    height: 22px;

    cursor: pointer;

    accent-color: #22c55e;
}

.delete {

    background: red;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 7px 10px;

    cursor: pointer;

    transition: 0.3s;
}

.delete:hover {

    transform: scale(1.1);

    box-shadow:
    0 0 10px red;
}

.footer {

    text-align: center;

    margin-top: 20px;

    color: #94a3b8;

    font-size: 14px;
}

</style>

</head>

<body>

<div class="container">

<h1>📅 Daily Goal Tracker</h1>

<div class="stats">

✅ Completed:
<span id="completedCount">
0
</span>

|

📌 Total Goals:
<span id="totalCount">
0
</span>

</div>

<input type="date" id="date">

<input
type="text"
id="taskInput"
placeholder="Enter today's mission...">

<button
class="add-btn"
onclick="addTask()">

Add Goal 🚀

</button>

<ul id="taskList"></ul>

<div class="footer">

Built by Abhinav ⚡

</div>

</div>

<script>

let tasks =

JSON.parse(
localStorage.getItem("tasks")
)

|| [];

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );
}

function updateStats() {

    document.getElementById(
    "totalCount"
    ).innerText = tasks.length;

    document.getElementById(
    "completedCount"
    ).innerText =

    tasks.filter(
    task => task.done
    ).length;
}

function renderTasks() {

    const list =
    document.getElementById(
    "taskList"
    );

    list.innerHTML = "";

    tasks.forEach((task, index) => {

        const li =
        document.createElement("li");

        li.innerHTML = `

        <div class="task-left">

        <input
        type="checkbox"

        ${task.done ? "checked" : ""}

        onchange="toggleTask(${index})">

        <div class="task-info">

        <span class="${
        task.done ? "completed" : ""
        }">

        ${task.text}

        </span>

        <span class="date">

        📅 ${task.date}

        </span>

        </div>

        </div>

        <button
        class="delete"
        onclick="deleteTask(${index})">

        X

        </button>

        `;

        list.appendChild(li);
    });

    updateStats();
}

function addTask() {

    const input =
    document.getElementById(
    "taskInput"
    );

    const date =
    document.getElementById(
    "date"
    );

    if(input.value.trim() === "")
    return;

    tasks.push({

        text: input.value,

        date:
        date.value || "No Date",

        done: false
    });

    saveTasks();

    renderTasks();

    input.value = "";
}

function toggleTask(index) {

    tasks[index].done =

    !tasks[index].done;

    saveTasks();

    renderTasks();
}

function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    renderTasks();
}

document
.getElementById("taskInput")

.addEventListener(

"keypress",

function(event) {

    if(event.key === "Enter") {

        addTask();
    }
});

renderTasks();

</script>

</body>

</html>
