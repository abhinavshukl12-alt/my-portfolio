<!DOCTYPE html>
<html>

<head>

<title>Neon To-Do App</title>

<style>

body {

    background: #050816;

    color: white;

    font-family: Arial;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;
}

.container {

    background:
    rgba(255,255,255,0.05);

    padding: 25px;

    border-radius: 20px;

    width: 350px;

    box-shadow:
    0 0 20px #38bdf8;
}

h1 {

    text-align: center;

    text-shadow:
    0 0 10px #38bdf8;
}

.input-area {

    display: flex;

    gap: 10px;
}

input {

    flex: 1;

    padding: 10px;

    border: none;

    border-radius: 10px;
}

button {

    padding: 10px;

    border: none;

    border-radius: 10px;

    background: #38bdf8;

    cursor: pointer;
}

ul {

    list-style: none;

    padding: 0;

    margin-top: 20px;
}

li {

    background:
    rgba(255,255,255,0.08);

    margin-bottom: 10px;

    padding: 10px;

    border-radius: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.completed {

    text-decoration: line-through;

    opacity: 0.6;
}

.delete {

    background: red;

    color: white;

    border: none;

    padding: 5px 8px;

    border-radius: 8px;

    cursor: pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>📋 Neon To-Do</h1>

<div class="input-area">

<input
type="text"
id="taskInput"
placeholder="Enter task...">

<button onclick="addTask()">
Add
</button>

</div>

<ul id="taskList"></ul>

</div>

<script>

function addTask() {

    let input =
    document.getElementById("taskInput");

    let task =
    input.value.trim();

    if(task === "")
    return;

    let li =
    document.createElement("li");

    li.innerHTML = `

    <span onclick="toggleTask(this)">
    ${task}
    </span>

    <button
    class="delete"
    onclick="deleteTask(this)">
    X
    </button>

    `;

    document
    .getElementById("taskList")
    .appendChild(li);

    input.value = "";
}

function toggleTask(element) {

    element.classList.toggle(
    "completed"
    );
}

function deleteTask(button) {

    button.parentElement.remove();
}

</script>

</body>

</html>
