<!DOCTYPE html>
<html>

<head>

<title>Daily Goal Tracker</title>

<style>

body {

    background: #050816;

    color: white;

    font-family: Arial;

    display: flex;

    justify-content: center;

    padding-top: 40px;
}

.container {

    width: 400px;

    background:
    rgba(255,255,255,0.05);

    padding: 20px;

    border-radius: 20px;

    box-shadow:
    0 0 20px #38bdf8;
}

h1 {

    text-align: center;

    text-shadow:
    0 0 10px #38bdf8;
}

input, button {

    padding: 10px;

    border: none;

    border-radius: 10px;

    margin-top: 10px;
}

#taskInput {

    width: 95%;
}

button {

    background: #38bdf8;

    cursor: pointer;
}

ul {

    list-style: none;

    padding: 0;
}

li {

    background:
    rgba(255,255,255,0.08);

    margin-top: 10px;

    padding: 10px;

    border-radius: 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.completed {

    text-decoration: line-through;

    opacity: 0.6;
}

.date {

    color: #38bdf8;

    font-size: 14px;
}

.delete {

    background: red;

    color: white;

    padding: 5px 8px;
}

</style>

</head>

<body>

<div class="container">

<h1>📅 Daily Goal Tracker</h1>

<input type="date" id="date">

<input
type="text"
id="taskInput"
placeholder="Enter today's target...">

<button onclick="addTask()">
Add Goal 🚀
</button>

<ul id="taskList"></ul>

</div>

<script>

let tasks =
JSON.parse(localStorage.getItem("tasks"))
|| [];

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );
}

function renderTasks() {

    const list =
    document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach((task, index) => {

        const li =
        document.createElement("li");

        li.innerHTML = `

        <div>

        <input
        type="checkbox"
        ${task.done ? "checked" : ""}
        onchange="toggleTask(${index})">

        <span class="${
        task.done ? "completed" : ""
        }">

        ${task.text}

        </span>

        <div class="date">
        📅 ${task.date}
        </div>

        </div>

        <button
        class="delete"
        onclick="deleteTask(${index})">

        X

        </button>

        `;

        list.appendChild(li);
    });
}

function addTask() {

    const input =
    document.getElementById("taskInput");

    const date =
    document.getElementById("date");

    if(input.value.trim() === "")
    return;

    tasks.push({

        text: input.value,

        date: date.value || "No Date",

        done: false
    });

    saveTasks();

    renderTasks();

    input.value = "";
}

function toggleTask(index) {

    tasks[index].done =
    !tasks[index].done;

    saveTasks();

    renderTasks();
}

function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    renderTasks();
}

renderTasks();

</script>

</body>

</html>
