<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OMEGA X // ORBITAL COMMAND</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:monospace;
  color:#00ffe1;
}

#ui{
  position:absolute;
  top:20px;
  left:20px;
  z-index:10;
}

.panel{
  background:rgba(0,0,0,0.4);
  border:1px solid #00ffe1;
  padding:10px;
  margin-bottom:10px;
  backdrop-filter: blur(10px);
}

button{
  margin:5px;
  padding:8px;
  background:black;
  border:1px solid #00ffe1;
  color:#00ffe1;
  cursor:pointer;
}

button:hover{
  background:#00ffe1;
  color:black;
}

#alert{
  position:absolute;
  bottom:20px;
  right:20px;
  border:1px solid red;
  color:red;
  padding:10px;
  display:none;
}
</style>
</head>

<body>

<div id="ui">

  <div class="panel">
    🌍 ORBITAL CONTROL<br><br>
    <button onclick="deploySatellite()">🛰 DEPLOY SATELLITE</button>
    <button onclick="triggerAnomaly()">⚠ ANOMALY SCAN</button>
    <button onclick="resetSystem()">🔄 RESET</button>
  </div>

  <div class="panel">
    STATUS: <span id="status">STABLE</span><br>
    SATELLITES: <span id="sat">0</span>
  </div>

</div>

<div id="alert">UNKNOWN ANOMALY DETECTED</div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

// 🌍 SCENE
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 🌍 EARTH
const earthGeo = new THREE.SphereGeometry(2, 32, 32);
const earthMat = new THREE.MeshBasicMaterial({color:0x00ffe1, wireframe:true});
const earth = new THREE.Mesh(earthGeo, earthMat);
scene.add(earth);

// 🛰 SATELLITES
let satellites = [];

// CAMERA
camera.position.z = 6;

// 🛰 ADD SATELLITE
function deploySatellite(){
  let satGeo = new THREE.SphereGeometry(0.1, 8, 8);
  let satMat = new THREE.MeshBasicMaterial({color:0xffffff});
  let sat = new THREE.Mesh(satGeo, satMat);

  let angle = Math.random()*Math.PI*2;
  sat.userData = {
    angle: angle,
    radius: 3
  };

  satellites.push(sat);
  scene.add(sat);

  document.getElementById("sat").innerText = satellites.length;
}

// ⚠ ANOMALY EVENT
function triggerAnomaly(){
  document.getElementById("alert").style.display="block";
  document.getElementById("status").innerText="THREAT DETECTED";

  setTimeout(()=>{
    document.getElementById("alert").style.display="none";
    document.getElementById("status").innerText="STABLE";
  },3000);
}

// 🔄 RESET
function resetSystem(){
  satellites.forEach(s=>scene.remove(s));
  satellites=[];
  document.getElementById("sat").innerText="0";
}

// 🌌 ANIMATION LOOP
function animate(){
  requestAnimationFrame(animate);

  earth.rotation.y += 0.002;

  satellites.forEach(s=>{
    s.userData.angle += 0.02;
    s.position.x = Math.cos(s.userData.angle)*s.userData.radius;
    s.position.z = Math.sin(s.userData.angle)*s.userData.radius;
  });

  renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
