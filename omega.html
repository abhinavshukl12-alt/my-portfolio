<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OMEGA X // DEFENSE MODE</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:monospace;
  color:#00ffe1;
}

/* 🌍 UI */
#ui{
  position:absolute;
  top:20px;
  left:20px;
  z-index:10;
}

.panel{
  background:rgba(0,0,0,0.5);
  border:1px solid #00ffe1;
  padding:10px;
  margin-bottom:10px;
  backdrop-filter: blur(10px);
}

button{
  margin:5px;
  padding:8px;
  background:black;
  border:1px solid #00ffe1;
  color:#00ffe1;
  cursor:pointer;
}

button:hover{
  background:#00ffe1;
  color:black;
}

/* ⚠ ALERT */
#alert{
  position:absolute;
  bottom:20px;
  right:20px;
  border:1px solid red;
  color:red;
  padding:10px;
  display:none;
  animation:blink 0.5s infinite;
}

@keyframes blink{
  50%{opacity:0.2;}
}

/* 🔴 LASER BEAM */
.beam{
  position:absolute;
  width:4px;
  height:100px;
  background:cyan;
  box-shadow:0 0 20px cyan;
  display:none;
}
</style>
</head>

<body>

<div id="ui">

  <div class="panel">
    🌌 OMEGA DEFENSE SYSTEM<br><br>

    <button onclick="deploy()">🛰 DEPLOY SATELLITE</button>
    <button onclick="anomaly()">⚠ ANOMALY ALERT</button>
    <button onclick="fire()">🔫 FIRE DEFENSE BEAM</button>
    <button onclick="asteroid()">☄ ASTEROID INCOMING</button>
    <button onclick="reset()">🔄 RESET</button>

  </div>

  <div class="panel">
    SATELLITES: <span id="sat">0</span><br>
    STATUS: <span id="status">STABLE</span>
  </div>

</div>

<div id="alert">UNKNOWN THREAT DETECTED</div>
<div class="beam" id="beam"></div>

<!-- THREE JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

// 🌍 SCENE
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 🌍 EARTH
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(2,32,32),
  new THREE.MeshBasicMaterial({color:0x00ffe1,wireframe:true})
);
scene.add(earth);

camera.position.z = 6;

// 🛰 SATELLITES
let sats = [];

// ☄ ASTEROID
let asteroidObj = null;

// 🛰 DEPLOY
function deploy(){
  let sat = new THREE.Mesh(
    new THREE.SphereGeometry(0.08,8,8),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );

  sat.userData = {
    angle: Math.random()*Math.PI*2,
    radius: 3
  };

  sats.push(sat);
  scene.add(sat);

  document.getElementById("sat").innerText = sats.length;
}

// ⚠ ANOMALY
function anomaly(){
  document.getElementById("alert").innerText = "⚠ SPACE ANOMALY DETECTED";
  document.getElementById("alert").style.display="block";
  document.getElementById("status").innerText="THREAT ACTIVE";

  setTimeout(()=>{
    document.getElementById("alert").style.display="none";
    document.getElementById("status").innerText="STABLE";
  },3000);
}

// ☄ ASTEROID
function asteroid(){
  asteroidObj = new THREE.Mesh(
    new THREE.SphereGeometry(0.3,16,16),
    new THREE.MeshBasicMaterial({color:0xff0000})
  );

  asteroidObj.position.set(5,2,0);
  scene.add(asteroidObj);

  document.getElementById("alert").innerText="☄ ASTEROID INBOUND!";
  document.getElementById("alert").style.display="block";
}

// 🔫 FIRE BEAM
function fire(){
  let beam = document.getElementById("beam");
  beam.style.display="block";
  beam.style.left = "50%";
  beam.style.top = "40%";

  document.body.style.filter="brightness(2)";

  setTimeout(()=>{
    beam.style.display="none";
    document.body.style.filter="none";

    if(asteroidObj){
      scene.remove(asteroidObj);
      asteroidObj=null;
      document.getElementById("alert").innerText="☄ TARGET DESTROYED";
    }
  },500);
}

// 🔄 RESET
function reset(){
  sats.forEach(s=>scene.remove(s));
  sats=[];
  document.getElementById("sat").innerText=0;

  if(asteroidObj) scene.remove(asteroidObj);
  asteroidObj=null;
}

// 🌌 ANIMATE LOOP
function animate(){
  requestAnimationFrame(animate);

  earth.rotation.y += 0.002;

  sats.forEach(s=>{
    s.userData.angle += 0.02;
    s.position.x = Math.cos(s.userData.angle)*s.userData.radius;
    s.position.z = Math.sin(s.userData.angle)*s.userData.radius;
  });

  if(asteroidObj){
    asteroidObj.position.x -= 0.03;
  }

  renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
