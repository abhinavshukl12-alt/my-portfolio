<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PROJECT OMEGA X</title>

<link rel="stylesheet" href="omega.css">

</head>

<body>

<!-- animated stars -->

<div class="stars"></div>
<!-- ai orb -->

<div id="orb"></div>

<!-- radar -->

<div class="radar">

<div class="sweep"></div>

</div>

<!-- hologram earth -->

<div class="planet"></div>

<!-- particles -->

<canvas id="particles"></canvas>
<!-- top bar -->

<div class="topbar">

<div class="logo">
Ω OMEGA X
</div>

<div class="status">
SYSTEM ONLINE ⚡
</div>

</div>

<!-- left system panel -->

<div class="panel left-panel">

<h2>🛰 SATELLITE GRID</h2>

<div class="bar">

<p>Signal Strength</p>

<div class="progress">
<div></div>
</div>

</div>

<div class="bar">

<p>Defense Matrix</p>

<div class="progress">
<div></div>
</div>

</div>

<div class="bar">

<p>Quantum Power</p>

<div class="progress">
<div></div>
</div>

</div>

<div class="bar">

<p>Orbital Scanner</p>

<div class="progress">
<div></div>
</div>

</div>

</div>

<!-- right system panel -->

<div class="panel right-panel">

<h2>🤖 AI CORE</h2>

<div class="bar">

<p>Neural Activity</p>

<div class="progress">
<div></div>
</div>

</div>

<div class="bar">

<p>Threat Analysis</p>

<div class="progress">
<div></div>
</div>

</div>

<div class="bar">

<p>Energy Reactor</p>

<div class="progress">
<div></div>
</div>

</div>

<div class="bar">

<p>Planetary Shield</p>

<div class="progress">
<div></div>
</div>

</div>

</div>

<!-- center reactor -->

<div class="core-container">

<div class="core-ring"></div>

<div class="core-ring"></div>

<div class="core"></div>

</div>

<!-- system logs -->

<div class="log" id="log">

<p>> OMEGA SYSTEM INITIALIZED</p>

<p>> QUANTUM NETWORK ONLINE</p>

<p>> DEFENSE GRID ACTIVE</p>

</div>

<!-- bottom controls -->

<div class="controls">

<button
class="control-btn"
onclick="systemLog(
'☄ ORBITAL STRIKE ACTIVATED'
)">
☄ ORBITAL STRIKE
</button>

<button
class="control-btn"
onclick="systemLog(
'🛰 SATELLITE EVOLUTION COMPLETE'
)">
🛰 SATELLITE EVOLUTION
</button>

<button
class="control-btn"
onclick="systemLog(
'🤖 MECH ARMY DEPLOYED'
)">
🤖 ARMY DEPLOY
</button>

<button
class="control-btn"
onclick="launchMissile()">
🚀 MISSILE LAUNCH
</button>

<button
class="control-btn"
onclick="redAlert()">
🚨 RED ALERT
</button>

<button
class="control-btn"
onclick="systemLog(
'🌌 QUANTUM SHIELD ONLINE'
)">
🌌 SHIELD SYSTEM
</button>

</div>

<script src="omega.js"></script>

</body>

</html>
