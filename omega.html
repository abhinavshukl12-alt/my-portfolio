<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OMEGA X // SPACE DEFENSE GAME</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:monospace;
  color:#00ffe1;
}

#ui{
  position:absolute;
  top:15px;
  left:15px;
  z-index:10;
}

.panel{
  background:rgba(0,0,0,0.6);
  border:1px solid #00ffe1;
  padding:10px;
  margin-bottom:10px;
}

button{
  margin:4px;
  padding:8px;
  background:black;
  border:1px solid #00ffe1;
  color:#00ffe1;
  cursor:pointer;
}

button:hover{
  background:#00ffe1;
  color:black;
}

/* ⚠ ALERT */
#alert{
  position:absolute;
  bottom:20px;
  right:20px;
  border:1px solid red;
  color:red;
  padding:10px;
  display:none;
  animation:blink 0.4s infinite;
}

@keyframes blink{
  50%{opacity:0.2;}
}

#score{
  color:white;
}
</style>
</head>

<body>

<div id="ui">

  <div class="panel">
    🌌 OMEGA SPACE DEFENSE<br><br>

    <button onclick="deploy()">🛰 SATELLITE</button>
    <button onclick="fire()">🔫 LASER FIRE</button>
    <button onclick="startWave()">☄ START ATTACK</button>
    <button onclick="reset()">🔄 RESET</button>
  </div>

  <div class="panel">
    ❤️ HEALTH: <span id="hp">100</span><br>
    🎯 SCORE: <span id="score">0</span><br>
    🛰 SATS: <span id="sat">0</span>
  </div>

</div>

<div id="alert">THREAT DETECTED</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

// 🌍 SETUP
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// 🌍 EARTH
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(2,32,32),
  new THREE.MeshBasicMaterial({color:0x00ffe1,wireframe:true})
);
scene.add(earth);
camera.position.z = 6;

// 🛰 SATELLITES
let sats = [];

// ☄ ASTEROIDS
let asteroids = [];

// 🎯 GAME STATE
let hp = 100;
let score = 0;

// 🛰 DEPLOY SAT
function deploy(){
  let s = new THREE.Mesh(
    new THREE.SphereGeometry(0.08,8,8),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );

  s.userData = {angle:Math.random()*Math.PI*2, radius:3};
  sats.push(s);
  scene.add(s);

  document.getElementById("sat").innerText = sats.length;
}

// ☄ SPAWN WAVE
function startWave(){
  for(let i=0;i<5;i++){
    let a = new THREE.Mesh(
      new THREE.SphereGeometry(0.2,16,16),
      new THREE.MeshBasicMaterial({color:0xff0000})
    );

    a.position.set(6+Math.random()*3, Math.random()*2,0);
    asteroids.push(a);
    scene.add(a);
  }

  alertMsg("☄ ASTEROID WAVE INCOMING");
}

// 🔫 FIRE LASER
function fire(){
  if(asteroids.length>0){
    let hit = asteroids.pop();
    scene.remove(hit);

    score += 10;
    document.getElementById("score").innerText = score;

    flash();
  }
}

// ⚡ FLASH EFFECT
function flash(){
  document.body.style.filter="brightness(2)";
  setTimeout(()=>document.body.style.filter="none",100);
}

// ⚠ ALERT
function alertMsg(t){
  let a=document.getElementById("alert");
  a.innerText=t;
  a.style.display="block";

  setTimeout(()=>a.style.display="none",2000);
}

// 🔄 RESET
function reset(){
  sats.forEach(s=>scene.remove(s));
  asteroids.forEach(a=>scene.remove(a));

  sats=[];
  asteroids=[];

  hp=100;
  score=0;

  document.getElementById("hp").innerText=hp;
  document.getElementById("score").innerText=score;
  document.getElementById("sat").innerText=0;
}

// 🌌 GAME LOOP
function animate(){
  requestAnimationFrame(animate);

  earth.rotation.y += 0.002;

  sats.forEach(s=>{
    s.userData.angle += 0.02;
    s.position.x = Math.cos(s.userData.angle)*s.userData.radius;
    s.position.z = Math.sin(s.userData.angle)*s.userData.radius;
  });

  asteroids.forEach(a=>{
    a.position.x -= 0.02;

    // 💥 HIT EARTH
    if(a.position.x < -2){
      hp -= 10;
      document.getElementById("hp").innerText = hp;
      scene.remove(a);
      asteroids = asteroids.filter(x=>x!==a);

      alertMsg("⚠ EARTH HIT!");
    }
  });

  renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
