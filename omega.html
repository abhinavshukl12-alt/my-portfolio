<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PROJECT OMEGA X</title>

<style>

body {

    margin: 0;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background:
    radial-gradient(circle at center,
    #0f172a,
    #000000);

    color: white;
}

/* stars */

.stars {

    position: fixed;

    width: 100%;

    height: 100%;

    background:
    url("https://www.transparenttextures.com/patterns/stardust.png");

    animation:
    moveStars 60s linear infinite;

    opacity: 0.4;
}

@keyframes moveStars {

    from {

        transform: translateY(0);
    }

    to {

        transform: translateY(-1000px);
    }
}

/* boot screen */

#boot {

    position: fixed;

    width: 100%;

    height: 100%;

    background: black;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    z-index: 9999;

    color: #38bdf8;

    font-size: 24px;

    text-shadow:
    0 0 10px #38bdf8;
}

/* main system */

.main {

    display: none;

    padding: 20px;
}

.title {

    text-align: center;

    font-size: 40px;

    color: #38bdf8;

    text-shadow:
    0 0 20px #38bdf8;
}

/* energy core */

.core {

    width: 220px;

    height: 220px;

    border-radius: 50%;

    margin: 30px auto;

    background:
    radial-gradient(circle,
    #38bdf8,
    #0ea5e9,
    #020617);

    box-shadow:
    0 0 60px #38bdf8,
    0 0 120px #38bdf8;

    animation:
    pulse 3s infinite alternate,
    rotateCore 10s linear infinite;
}

@keyframes pulse {

    from {

        transform: scale(1);
    }

    to {

        transform: scale(1.08);
    }
}

@keyframes rotateCore {

    from {

        transform: rotate(0deg);
    }

    to {

        transform: rotate(360deg);
    }
}

/* command buttons */

.controls {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 15px;

    margin-top: 30px;
}

button {

    padding: 15px 25px;

    border: none;

    border-radius: 12px;

    background: rgba(255,255,255,0.08);

    color: white;

    cursor: pointer;

    font-size: 16px;

    transition: 0.3s;

    box-shadow:
    0 0 10px rgba(56,189,248,0.4);
}

button:hover {

    transform: scale(1.08);

    background: #38bdf8;

    color: black;

    box-shadow:
    0 0 20px #38bdf8;
}

/* system log */

.log {

    width: 80%;

    margin: 30px auto;

    background:
    rgba(255,255,255,0.05);

    border-radius: 15px;

    padding: 20px;

    height: 180px;

    overflow-y: auto;

    box-shadow:
    0 0 15px rgba(56,189,248,0.3);
}

.log p {

    margin: 8px 0;

    color: #38bdf8;
}

/* alert */

.alert {

    position: fixed;

    top: 20px;

    right: 20px;

    background: red;

    padding: 15px;

    border-radius: 10px;

    box-shadow:
    0 0 20px red;

    display: none;

    animation:
    flash 0.5s infinite alternate;
}

@keyframes flash {

    from {

        opacity: 0.5;
    }

    to {

        opacity: 1;
    }
}

</style>

</head>

<body>

<div class="stars"></div>

<!-- boot -->

<div id="boot">

<p id="bootText">

INITIALIZING OMEGA CORE...

</p>

</div>

<!-- alert -->

<div class="alert" id="alertBox">

⚠ THREAT DETECTED

</div>

<!-- main -->

<div class="main" id="mainSystem">

<h1 class="title">

PROJECT OMEGA X

</h1>

<div class="core"></div>

<div class="controls">

<button onclick="systemLog(
'☄ ORBITAL STRIKE ACTIVATED'
)">
☄ ORBITAL STRIKE
</button>

<button onclick="systemLog(
'🛰 SATELLITE EVOLUTION COMPLETE'
)">
🛰 SATELLITE EVOLUTION
</button>

<button onclick="systemLog(
'🤖 MECH ARMY DEPLOYED'
)">
🤖 ARMY DEPLOY
</button>

<button onclick="launchMissile()">
🚀 MISSILE LAUNCH
</button>

<button onclick="redAlert()">
🚨 RED ALERT
</button>

<button onclick="systemLog(
'🌌 QUANTUM SHIELD ONLINE'
)">
🌌 SHIELD SYSTEM
</button>

</div>

<div class="log" id="log">

<p>

SYSTEM READY ⚡

</p>

</div>

</div>

<script>

/* boot sequence */

const bootText =
document.getElementById("bootText");

const bootMessages = [

"INITIALIZING OMEGA CORE...",

"CONNECTING QUANTUM NODES...",

"LOADING DEFENSE GRID...",

"AI LINK ESTABLISHED...",

"WELCOME COMMANDER ABHINAV ⚡"

];

let index = 0;

const bootInterval =
setInterval(() => {

    index++;

    if(index < bootMessages.length) {

        bootText.innerText =
        bootMessages[index];
    }

    else {

        clearInterval(bootInterval);

        document
        .getElementById("boot")
        .style.display = "none";

        document
        .getElementById("mainSystem")
        .style.display = "block";
    }

}, 1500);

/* logs */

function systemLog(message) {

    const log =
    document.getElementById("log");

    const p =
    document.createElement("p");

    p.innerText =
    "> " + message;

    log.prepend(p);
}

/* missile */

function launchMissile() {

    systemLog(
    "🚀 MISSILE LAUNCH SEQUENCE STARTED"
    );

    let count = 5;

    const countdown =
    setInterval(() => {

        systemLog(
        "T-" + count
        );

        count--;

        if(count < 0) {

            clearInterval(
            countdown
            );

            systemLog(
            "🌌 MISSILE SUCCESSFULLY DEPLOYED"
            );
        }

    }, 1000);
}

/* alert */

function redAlert() {

    const alertBox =
    document.getElementById(
    "alertBox"
    );

    alertBox.style.display =
    "block";

    systemLog(
    "⚠ RED ALERT ACTIVATED"
    );

    setTimeout(() => {

        alertBox.style.display =
        "none";

    }, 5000);
}

</script>

</body>

</html>
