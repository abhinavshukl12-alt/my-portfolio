<!DOCTYPE html>
<html>

<head>

<title>Neon Calculator</title>

<style>

body {

    background: #050816;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    font-family: Arial;
}

.calculator {

    background: rgba(255,255,255,0.05);

    padding: 20px;

    border-radius: 20px;

    box-shadow:
    0 0 20px #38bdf8;

    width: 320px;
}

#display {

    width: 100%;

    height: 60px;

    font-size: 28px;

    margin-bottom: 15px;

    border: none;

    border-radius: 10px;

    text-align: right;

    padding-right: 10px;

    background: black;

    color: #38bdf8;
}

.buttons {

    display: grid;

    grid-template-columns:
    repeat(4, 1fr);

    gap: 10px;
}

button {

    padding: 20px;

    font-size: 20px;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    background: #111827;

    color: white;

    transition: 0.3s;
}

button:hover {

    transform: scale(1.05);

    box-shadow:
    0 0 15px #38bdf8;
}

.equal {

    background: #38bdf8;

    color: black;
}

</style>

</head>

<body>

<div class="calculator">

<input type="text" id="display" disabled>

<div class="buttons">

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('/')">÷</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('*')">×</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('-')">−</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="calculate()" class="equal">
=
</button>

<button onclick="add('+')">+</button>

<button onclick="clearDisplay()">
C
</button>

</div>

</div>

<script>

const display =
document.getElementById("display");

function add(value) {

    display.value += value;
}

function calculate() {

    try {

        display.value =
        eval(display.value);
    }

    catch {

        display.value =
        "Error";
    }
}

function clearDisplay() {

    display.value = "";
}

</script>

</body>
</html>
