<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConceptLab Simulation Sandbox</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border-radius: 8px;
        }
        canvas {
            background-color: #05070c;
            display: block;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #00ffcc;
            color: #05070c;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <h1>🔬 ConceptLab Sandbox Engine</h1>
    
    <div id="canvas-container">
        <canvas id="sandboxCanvas" width="800" height="500"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn">Run Simulation</button>
        <button id="resetBtn">Reset Frame</button>
    </div>

    <script>
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');

        // Test draw to make sure engine initialization works
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        
        // Draw coordinate grid lines
        for(let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for(let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    </script>
</body>
</html>
