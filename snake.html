<!DOCTYPE html>
<html>

<head>

<title>Snake Game</title>

<style>

body {

    background: #050816;

    color: white;

    text-align: center;

    font-family: Arial;
}

h1 {

    text-shadow: 0 0 15px #38bdf8;
}

canvas {

    background: black;

    border: 3px solid #38bdf8;

    box-shadow: 0 0 20px #38bdf8;

    margin-top: 20px;
}

</style>

</head>

<body>

<h1>🐍 Neon Snake Game</h1>

<p>Use Arrow Keys to Play</p>

<canvas id="game" width="400" height="400">
</canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const box = 20;

let snake = [
    {x: 200, y: 200}
];

let food = {

    x: Math.floor(Math.random()*20)*box,

    y: Math.floor(Math.random()*20)*box
};

let direction = "RIGHT";

let score = 0;

document.addEventListener("keydown", changeDirection);

function changeDirection(event) {

    if(event.key === "ArrowUp" &&
       direction !== "DOWN")

       direction = "UP";

    else if(event.key === "ArrowDown" &&
       direction !== "UP")

       direction = "DOWN";

    else if(event.key === "ArrowLeft" &&
       direction !== "RIGHT")

       direction = "LEFT";

    else if(event.key === "ArrowRight" &&
       direction !== "LEFT")

       direction = "RIGHT";
}

function drawGame() {

    ctx.clearRect(0,0,400,400);

    /* food */

    ctx.fillStyle = "red";

    ctx.fillRect(food.x, food.y, box, box);

    /* snake */

    for(let i=0; i<snake.length; i++) {

        ctx.fillStyle =
        i === 0 ? "#38bdf8" : "white";

        ctx.fillRect(
            snake[i].x,
            snake[i].y,
            box,
            box
        );
    }

    let headX = snake[0].x;
    let headY = snake[0].y;

    if(direction === "UP")
        headY -= box;

    if(direction === "DOWN")
        headY += box;

    if(direction === "LEFT")
        headX -= box;

    if(direction === "RIGHT")
        headX += box;

    /* eat food */

    if(headX === food.x &&
       headY === food.y) {

        score++;

        food = {

            x: Math.floor(Math.random()*20)*box,

            y: Math.floor(Math.random()*20)*box
        };
    }

    else {

        snake.pop();
    }

    const newHead = {

        x: headX,
        y: headY
    };

    /* game over */

    if(

        headX < 0 ||
        headY < 0 ||
        headX >= 400 ||
        headY >= 400 ||

        snake.some(
            segment =>
            segment.x === headX &&
            segment.y === headY
        )

    ) {

        clearInterval(game);

        alert(
        "Game Over! Score: " + score
        );
    }

    snake.unshift(newHead);

    ctx.fillStyle = "white";

    ctx.fillText(
        "Score: " + score,
        10,
        390
    );
}

const game =
setInterval(drawGame, 120);

</script>

</body>
</html>
